# Perfil de Codex para orquestar: reparte trabajo y verifica, gastando pocos tokens.
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "low"
tool_output_token_limit = 8000
model_auto_compact_token_limit = 120000

[agents]
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"

# Sin herramientas que un agente de código no usa: cada una se manda en cada llamada (~5k tokens medidos).
[features]
plugins = false
apps = false
browser_use = false
computer_use = false
image_generation = false
